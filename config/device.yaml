# Device connection settings
#
# Windows + PEAK PCAN:
#   interface_type: "pcan"
#   interface_name: "PCAN_USBBUS1"
#
# Ubuntu + SocketCAN:
#   interface_type: "socketcan"
#   interface_name: "can0"
#   Bring the interface up first:
#   sudo ip link set can0 type can bitrate 1000000
#   sudo ip link set can0 up

device:
  side: "left"              # left-hand unit: left / right
  interface_type: "pcan"
  interface_name: "PCAN_USBBUS1"

sequence:
  fps: 25                   # command rate, 25-50 is stable in practice
  transition: 0.6           # seconds to blend between two gestures
  hold: 0.8                 # seconds to hold each gesture

# Closed-loop grasp: close step by step and stop as soon as contact is
# detected. `source` picks the signal:
#   angle_error - lag between commanded and measured angle (works on any hand)
#   torque      - joint torque rise (0-100 units)
#   force       - fingertip pressure (only on hands that report it)
grasp:
  target: "fist"            # gesture the hand closes towards
  source: "angle_error"     # angle_error | torque | force
  steps: 20                 # increments from open to target
  interval: 0.15            # seconds between increments
  tolerance: 12.0           # angle_error: degrees counted as contact
  torque_threshold: 15.0    # torque: 0-100 unit rise counted as contact
  threshold: 30.0           # force: raw pressure delta counted as contact
  fingers: ["thumb", "index", "middle", "ring", "pinky"]
  hold: 1.0                 # seconds to hold the grip after contact
