# L20 gesture definitions
#
# Each gesture is 16 joint values in the range 0-100.
# The order is fixed and must match joints.py:
#   thumb_abd, thumb_yaw, thumb_root1, thumb_tip,
#   index_abd, index_root1, index_tip,
#   middle_abd, middle_root1, middle_tip,
#   ring_abd, ring_root1, ring_tip,
#   pinky_abd, pinky_root1, pinky_tip
#
# IMPORTANT: the value direction (whether 0 means extended or flexed) must be
# verified on real hardware with `python -m l20_gestures calibrate`. Different
# firmware versions may invert it. These presets assume 100 = extended,
# 0 = fully flexed.

gestures:
  open:
    desc: All five fingers extended
    angles: [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100]

  fist:
    desc: Fully closed fist
    angles: [100, 50, 0, 0, 50, 0, 0, 50, 0, 0, 50, 0, 0, 50, 0, 0]

  relax:
    desc: Natural slight curl (safe starting pose)
    angles: [70, 50, 65, 70, 50, 65, 70, 50, 65, 70, 50, 65, 70, 50, 65, 70]

  point:
    desc: Index finger pointing
    angles: [100, 50, 100, 100, 50, 100, 100, 50, 0, 0, 50, 0, 0, 50, 0, 0]

  thumbs_up:
    desc: Thumbs up (thumb out, other fingers closed)
    angles: [100, 50, 100, 100, 35, 0, 0, 35, 0, 0, 35, 0, 0, 35, 0, 0]

  # Tuned on real hardware: thumb abd 65 / yaw 70 / root1 40 / tip 25,
  # index 32/28. yaw 70 was chosen over 30 (too far in) and 95 (too far out).
  ok:
    desc: OK sign (thumb and index tip pinch)
    angles: [65, 70, 40, 25, 60, 32, 28, 60, 100, 100, 60, 100, 100, 60, 100, 100]

  pinch:
    desc: Three-finger pinch (thumb, index, middle)
    angles: [65, 70, 40, 25, 55, 45, 38, 55, 45, 38, 60, 100, 100, 60, 100, 100]
